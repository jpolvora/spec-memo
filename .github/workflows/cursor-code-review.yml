name: Agentic Code Review (Cursor)

on:
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to review'
        required: false
      source_branch:
        description: 'Source branch (e.g. develop)'
        required: false
        default: 'develop'
      target_branch:
        description: 'Target branch (e.g. master)'
        required: false
        default: 'master'

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v6
        with: { node-version: 22 }

      - name: Run code reviewer
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          # Default 600000 (10m) is tight for Custom-stack / large diffs.
          AGENTIC_CODE_REVIEWERS_TIMEOUT_MS: "1200000"
          # Exclude internal agent plans and specs if present
          AGENTIC_CODE_REVIEWERS_EXTRA_EXCLUDE_PATTERNS: ".agents/plans/**,.agents/specs/**"
        run: |
          set -euo pipefail
          SOURCE_BRANCH="${{ github.head_ref || inputs.source_branch || 'develop' }}"
          TARGET_BRANCH="${{ github.event.pull_request.base.ref || inputs.target_branch || 'master' }}"
          # Download to a file so BASH_SOURCE is bound (curl|bash leaves it unbound under set -u).
          curl -fsSL https://raw.githubusercontent.com/jpolvora/agentic-code-reviewers/release/run.sh \
            -o /tmp/agentic-code-reviewers-run.sh
          bash /tmp/agentic-code-reviewers-run.sh \
            --engine cursor-sdk \
            --model composer-2.5 \
            --variant high \
            --gh \
            --stack Custom \
            --custom-prompt .github/agentic-code-reviewers-prompt.md \
            --score-min 3 \
            --include-patterns "**/*.md,**/*.yml,**/*.yaml,**/*.json,**/*.sh,**/*.ps1,**/*.ts,**/*.js,**/*.cjs,**/*.prd" \
            --source-branch "refs/heads/${SOURCE_BRANCH}" \
            --target-branch "refs/heads/${TARGET_BRANCH}"

      - name: Check for unresolved threads
        id: check-threads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUM="${{ github.event.pull_request.number || inputs.pr_number || '' }}"
          if [ -n "$PR_NUM" ]; then
            ACTIVE=$(gh pr view "$PR_NUM" --json comments --jq '[.comments[] | select(.isResolved == false and .author.login != "github-actions[bot]" and .author.login != "github-actions")] | length' 2>/dev/null || echo 0)
            echo "active_threads=$ACTIVE" >> $GITHUB_OUTPUT
            echo "Unresolved threads: $ACTIVE"
          else
            echo "active_threads=0" >> $GITHUB_OUTPUT
            echo "No PR number provided; skipping unresolved threads check."
          fi

      - name: Block merge on unresolved threads
        if: ${{ steps.check-threads.outputs.active_threads != '0' }}
        run: |
          echo "::error::PR has ${{ steps.check-threads.outputs.active_threads }} unresolved review thread(s). Resolve them before merging."
          exit 1
