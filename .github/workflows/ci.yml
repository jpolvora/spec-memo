name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install native build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential python3
      - name: Git identity for vault-git tests
        run: |
          git config --global user.email "ci@spec-memo.test"
          git config --global user.name "spec-memo-ci"
      - run: npm ci
      - run: npm run build
      - name: Test (serial, native sqlite)
        run: node --test --test-concurrency=1 dist/**/*.test.js
