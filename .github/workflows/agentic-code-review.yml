name: Agentic Code Review

# Single active PR reviewer (agentic-code-reviewers).
# Replaces opencode-code-review.yml and cursor-code-review.yml.
#
# No yaml edit / commit / push is needed to switch reviewers. Change the three
# repo Variables via GitHub UI (Settings → Secrets and variables → Actions →
# Variables) or via gh client, and the next PR picks them up:
#
#   gh variable set AGENTIC_CODE_REVIEWERS_ENGINE --repo jpolvora/spec-memo --body "opencode"
#   gh variable set AGENTIC_CODE_REVIEWERS_MODEL  --repo jpolvora/spec-memo --body "opencode-go/muse-spark-1.3-contributor"
#   gh variable set AGENTIC_CODE_REVIEWERS_VARIANT --repo jpolvora/spec-memo --body "high"
#
# Engine examples: "opencode" (uses OPENCODE_API_KEY secret) or "cursor-sdk"
# (uses CURSOR_API_KEY secret). Model/variant examples: see
# https://github.com/jpolvora/agentic-code-reviewers (AGENTIC_CODE_REVIEWERS_MODEL
# / _VARIANT; --engine/--model/--variant flags override env).
on:
  pull_request:
    branches: [master, main, develop]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review (required for manual runs)
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: agentic-review-${{ github.event.pull_request.number || github.event.inputs.pr_number || github.ref }}
  cancel-in-progress: true

env:
  REVIEW_ENGINE: ${{ vars.AGENTIC_CODE_REVIEWERS_ENGINE || 'opencode' }}
  REVIEW_MODEL: ${{ vars.AGENTIC_CODE_REVIEWERS_MODEL || 'opencode-go/muse-spark-1.3-contributor' }}
  REVIEW_VARIANT: ${{ vars.AGENTIC_CODE_REVIEWERS_VARIANT || 'high' }}

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v6
        with: { node-version: "22.13" }

      - name: Show reviewer config
        run: |
          echo "engine=${REVIEW_ENGINE} model=${REVIEW_MODEL} variant=${REVIEW_VARIANT}"

      # Pre-install with an authenticated release lookup. The opencode.ai installer
      # otherwise hits unauthenticated api.github.com and fails with
      # "Failed to fetch version information" on shared CI IPs (rate limit).
      # Skipped for cursor-sdk (no OpenCode CLI needed).
      - name: Install OpenCode CLI
        if: ${{ env.REVIEW_ENGINE == 'opencode' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(gh api repos/anomalyco/opencode/releases/latest --jq '.tag_name' | sed 's/^v//')"
          echo "Installing opencode v${VERSION}"
          curl -fsSL https://opencode.ai/install -o /tmp/opencode-install.sh
          bash /tmp/opencode-install.sh --version "$VERSION"
          echo "${HOME}/.opencode/bin" >> "$GITHUB_PATH"
          export PATH="${HOME}/.opencode/bin:${PATH}"
          command -v opencode
          opencode --version

      - name: Resolve PR context
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            PR="${{ github.event.pull_request.number }}"
            HEAD_REF="${{ github.head_ref }}"
            BASE_REF="${{ github.event.pull_request.base.ref }}"
          else
            PR="${{ github.event.inputs.pr_number }}"
            [[ -n "$PR" ]] || { echo "::error::workflow_dispatch requires pr_number"; exit 1; }
            HEAD_REF="$(gh pr view "$PR" --json headRefName --jq .headRefName)"
            BASE_REF="$(gh pr view "$PR" --json baseRefName --jq .baseRefName)"
          fi
          echo "number=$PR" >> "$GITHUB_OUTPUT"
          echo "head_ref=$HEAD_REF" >> "$GITHUB_OUTPUT"
          echo "base_ref=$BASE_REF" >> "$GITHUB_OUTPUT"
          echo "Reviewing PR #$PR ($HEAD_REF → $BASE_REF)"

      - name: Run code reviewer
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          AGENTIC_CODE_REVIEWERS_TIMEOUT_MS: "1200000"
          AGENTIC_CODE_REVIEWERS_DIFF_MAX_BYTES: "200000"
          AGENTIC_CODE_REVIEWERS_EXTRA_EXCLUDE_PATTERNS: ".agents/plans/**,.agents/specs/**"
        run: |
          set -euo pipefail
          if [[ "${REVIEW_ENGINE}" == "cursor-sdk" || "${REVIEW_ENGINE}" == "cursor" ]]; then
            if [[ -z "${CURSOR_API_KEY:-}" ]]; then
              echo "::error::REVIEW_ENGINE=${REVIEW_ENGINE} needs CURSOR_API_KEY repository secret"
              exit 1
            fi
            ENGINE_ARG="cursor-sdk"
          else
            if [[ -z "${OPENCODE_API_KEY:-}" ]]; then
              echo "::error::REVIEW_ENGINE=${REVIEW_ENGINE} needs OPENCODE_API_KEY repository secret"
              exit 1
            fi
            ENGINE_ARG="opencode"
            export PATH="${HOME}/.opencode/bin:${PATH}"
          fi
          curl -fsSL https://raw.githubusercontent.com/jpolvora/agentic-code-reviewers/release/run.sh \
            -o /tmp/agentic-code-reviewers-run.sh
          bash /tmp/agentic-code-reviewers-run.sh \
            --engine "$ENGINE_ARG" \
            --model "$REVIEW_MODEL" \
            --variant "$REVIEW_VARIANT" \
            --gh \
            --pr-id "${{ steps.pr.outputs.number }}" \
            --stack Custom \
            --custom-prompt .github/agentic-code-reviewers-prompt.md \
            --score-min 3 \
            --include-patterns "**/*.md,**/*.mdc,**/*.yml,**/*.yaml,**/*.json,**/*.sh,**/*.ps1,**/*.psm1,**/*.psd1,**/*.cmd,**/*.js,**/*.ts,**/*.css,**/*.html,**/*.cjs,**/*.py,**/*.prd" \
            --source-branch "refs/heads/${{ steps.pr.outputs.head_ref }}" \
            --target-branch "refs/heads/${{ steps.pr.outputs.base_ref }}"

      - name: Check for unresolved threads
        id: check-threads
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          ACTIVE="$(gh api graphql \
            -f query='query($o:String!,$n:String!,$p:Int!){
              repository(owner:$o,name:$n){
                pullRequest(number:$p){
                  reviewThreads(first:100){ nodes { isResolved isOutdated } }
                }
              }
            }' \
            -f o="${{ github.repository_owner }}" \
            -f n="${{ github.event.repository.name }}" \
            -F p="$PR_NUMBER" \
            --jq '[.data.repository.pullRequest.reviewThreads.nodes[]
              | select(.isResolved == false and .isOutdated == false)] | length')"
          echo "active_threads=${ACTIVE}" >> "$GITHUB_OUTPUT"
          echo "Unresolved review threads: ${ACTIVE}"

      - name: Block merge on unresolved threads
        if: ${{ steps.check-threads.outputs.active_threads != '0' }}
        run: |
          echo "::error::PR has ${{ steps.check-threads.outputs.active_threads }} unresolved review thread(s). Resolve them before merging."
          exit 1
